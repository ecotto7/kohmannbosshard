[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com https://*.googleusercontent.com https://*.ggpht.com https://*.canva.com; font-src 'self' data:; frame-src https://maps.google.com https://www.google.com https://www.canva.com https://*.canva.com; connect-src 'self' https://maps.googleapis.com https://www.canva.com https://*.canva.com; form-action 'self' https://kohmannbosshard.app.box.com https://client.schwab.com https://wealth.emaplan.com https://kohmannbosshard.portal.tamaracinc.com https://brokercheck.finra.org; frame-ancestors 'none'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

